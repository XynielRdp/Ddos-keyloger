 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANIEL NESIA | VIP ACCESS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scrollbar muncul karena partikel */
            background: #000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ANIMASI BACKGROUND EMAS (PARTIKEL) --- */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: #000;
            /* Latar belakang logo Daniel Nesia tetap ada di belakang partikel */
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://files.catbox.moe/kivdno.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: 1; /* Di bawah kartu VIP */
        }

        /* --- KARTU VIP (Sama seperti V78.0) --- */
        .vip-card {
            width: 95%;
            max-width: 450px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border: 2px solid #d4af37; /* Gold Border */
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 10; /* Di atas partikel */
        }

        /* Hiasan emas di pojok (V78.0) */
        .vip-card::before {
            content: ""; position: absolute; top: 0; left: 0;
            width: 50px; height: 50px;
            border-top: 4px solid #d4af37; border-left: 4px solid #d4af37;
        }

        .vip-card::after {
            content: ""; position: absolute; bottom: 0; right: 0;
            width: 50px; height: 50px;
            border-bottom: 4px solid #d4af37; border-right: 4px solid #d4af37;
        }

        .vip-header {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            text-align: center;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .vip-badge {
            display: block;
            text-align: center;
            color: #fff;
            font-size: 0.6rem;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: 800;
            opacity: 0.7;
        }

        .form-label { 
            font-size: 0.8rem;
            font-weight: 800;
            color: #d4af37 !important; /* Gold terang */
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
            text-shadow: 1px 1px 2px #000;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(212, 175, 55, 0.3) !important;
            color: #fff !important;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-control:focus, .form-select:focus {
            border-color: #d4af37 !important;
            background: rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            color: #fff !important;
        }

        .price-tag {
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .price-tag span {
            color: #888;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .price-tag h2 {
            color: #fff;
            font-weight: 900;
            margin: 0;
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn-vip {
            width: 100%;
            background: #d4af37; /* Pure Gold */
            color: #000;
            font-weight: 900;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-vip:hover {
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.5);
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.65rem;
            color: #555;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="particles-js"></div>

<div class="vip-card">
    <div class="vip-header">DANIEL NESIA</div>
    <span class="vip-badge">Aktivasi Panel VIP</span>

    <div class="price-tag">
        <span>Amount to Pay</span>
        <h2 id="totalPrice">Rp 0</h2>
    </div>

    <div class="mb-1">
        <label class="form-label"><i class="fas fa-user-edit me-2"></i>Nama Lengkap</label>
        <input type="text" id="nama" class="form-control" placeholder="Input nama anda">
    </div>

    <div class="mb-1">
        <label class="form-label"><i class="fas fa-id-badge me-2"></i>Request Nama Result</label>
        <input type="text" id="panel_id" class="form-control" placeholder="Contoh: DanzGacor">
    </div>

    <div class="mb-1">
        <label class="form-label"><i class="fas fa-clock me-2"></i>Pilih Masa Aktif</label>
        <select id="paket" class="form-select" onchange="update()">
            <option value="0">-- KLIK UNTUK PILIH --</option>
            <option value="1500">1 Jam (Rp 1.500)</option>
            <option value="10000">1 Hari (Rp 10.000)</option>
            <option value="25000">1 Minggu (Rp 25.000) 🔥</option>
        </select>
    </div>

    <button onclick="kirimOrder()" class="btn-vip">
        Konfirmasi Pembayaran <i class="fas fa-crown ms-2"></i>
    </button>

    <div class="footer-note">
        Automatic Format System v80.0 &copy; Daniel Nesia ID
    </div>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    /* Konfigurasi particles.js untuk efek emas mengalir */
    particlesJS("particles-js", {
        "particles": {
            "number": {
                "value": 100, /* Jumlah partikel */
                "density": {
                    "enable": true,
                    "value_area": 800
                }
            },
            "color": {
                "value": "#d4af37" /* Warna Emas */
            },
            "shape": {
                "type": "circle", /* Bentuk lingkaran pelan */
                "stroke": {
                    "width": 0,
                    "color": "#000000"
                }
            },
            "opacity": {
                "value": 0.5,
                "random": true,
                "anim": {
                    "enable": true,
                    "speed": 1,
                    "opacity_min": 0.1,
                    "sync": false
                }
            },
            "size": {
                "value": 3,
                "random": true,
                "anim": {
                    "enable": true,
                    "speed": 2,
                    "size_min": 0.1,
                    "sync": false
                }
            },
            "line_linked": {
                "enable": false /* Tidak ada garis penghubung agar seperti debu */
            },
            "move": {
                "enable": true,
                "speed": 1.5, /* Kecepatan mengalir pelan */
                "direction": "top", /* Mengalir ke atas */
                "random": true,
                "straight": false,
                "out_mode": "out",
                "bounce": false,
                "attract": {
                    "enable": false,
                    "rotateX": 600,
                    "rotateY": 1200
                }
            }
        },
        "interactivity": {
            "detect_on": "canvas",
            "events": {
                "onhover": {
                    "enable": false
                },
                "onclick": {
                    "enable": false
                },
                "resize": true
            }
        },
        "retina_detect": true
    });

    /* Script Logika Order (Sama seperti sebelumnya) */
    function update() {
        const h = document.getElementById('paket').value;
        document.getElementById('totalPrice').innerText = "Rp " + parseInt(h).toLocaleString('id-ID');
    }

    function kirimOrder() {
        const n = document.getElementById('nama').value;
        const p = document.getElementById('panel_id').value;
        const h = document.getElementById('paket').value;
        const t = document.getElementById('paket').options[document.getElementById('paket').selectedIndex].text;

        if(!n || !p || h == "0") return alert("Woi! Lengkapi dulu datanya!");

        const msg = `*KONFIRMASI AKTIVASI VIP*\n` +
                    `━━━━━━━━━━━━━━━━\n` +
                    `👤 *User:* ${n}\n` +
                    `🖥️ *Result Name:* ${p.toUpperCase()}\n` +
                    `🗓️ *Package:* ${t}\n` +
                    `💰 *Price:* Rp ${parseInt(h).toLocaleString('id-ID')}\n` +
                    `━━━━━━━━━━━━━━━━\n` +
                    `_Saya mau bayar & aktivasi, tolong diproses Bos Daniel!_`;

        window.open(`https://wa.me/6285692069556?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>

</body>
</html>
